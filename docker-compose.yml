services:
  postgres:
    image: postgres:16-alpine
    container_name: household_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: household
      POSTGRES_PASSWORD: household
      POSTGRES_DB: household
    ports:
      - "5432:5432"
    volumes:
      - household_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U household"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  household_pg_data:
